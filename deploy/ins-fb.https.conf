server {
    listen 80;
    listen [::]:80;
    server_name ins-fb.tianyuyezi.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ins-fb.tianyuyezi.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ins-fb.tianyuyezi.com;
    ssl_certificate /etc/letsencrypt/live/ins-fb.tianyuyezi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ins-fb.tianyuyezi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/ins-fb.access.log;
    error_log /var/log/nginx/ins-fb.error.log;

    location ^~ /instagram/media/ {
        proxy_pass http://127.0.0.1:5191;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
    location = /instagram/callback {
        proxy_pass http://127.0.0.1:5191;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:5189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }
}
