server {
    listen 80;
    listen [::]:80;
    server_name ins-fb.tianyuyezi.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ins-fb.tianyuyezi.com$request_uri; }
}
